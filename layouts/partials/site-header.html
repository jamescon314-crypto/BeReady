{{ $featured_image := .Param "featured_image" | default "/images/banner.jpeg" }}

<header class="w-100 bg-navy">
  <!-- Navigation Bar -->
  <nav class="pv3 ph3 ph4-ns" role="navigation">
    <div class="flex-l justify-between items-center center max-w7">
      <a href="{{ .Site.Home.RelPermalink }}" class="f4 fw6 hover-white no-underline white-90 dib mr3">
        {{ .Site.Title }}
      </a>
      <ul class="list pl0 ma0 flex items-center">
        {{ range .Site.Menus.main }}
          <li class="mr3">
            <a class="hover-white no-underline white-80 f5" href="{{ .URL | relURL }}">
              {{ .Name }}
            </a>
          </li>
        {{ end }}
      </ul>
    </div>
  </nav>


  <img src="{{ $featured_image | relURL }}" alt="{{ .Title }}" style="width: 100%; height: auto; display: block;" />
</header>
